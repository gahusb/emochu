<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap');
    body { margin: 0; font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif; }
    a { color: #C5532D; } a:hover { color: #A8421F; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #2A241F;">

  <!-- 사진 한 장이 화면 전체 (실제로는 TourAPI firstImage) -->
  <div style="position: absolute; inset: 0; background: linear-gradient(155deg, #7A5642 0%, #C5532D 42%, #B8860B 78%, #3D2914 100%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(42,36,31,0.88) 0%, rgba(42,36,31,0.35) 48%, rgba(42,36,31,0.10) 100%);"></div>

  <!-- 최소 헤더 — 사진 위에 얹힌다 -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
    <span style="font-family: 'Jua', sans-serif; font-size: 18px; color: #FFFFFF;">이모추</span>
    <span style="display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.24); font-size: 12px; font-weight: 700; color: #FFFFFF;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      서울
    </span>
  </div>

  <!-- 다음 카드가 살짝 -->
  <div style="position: absolute; right: -18px; top: 300px; width: 44px; height: 240px; border-radius: 16px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.18);"></div>

  <!-- 감각 한 문장이 주인공 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 34px; display: flex; flex-direction: column; align-items: flex-start;">

    <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; background: rgba(197,83,45,0.92); font-size: 12px; font-weight: 700; color: #FFFFFF; margin-bottom: 16px;">
      지금 출발하면 딱
    </span>

    <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 42px; line-height: 1.16; color: #FFFFFF; word-break: keep-all; letter-spacing: -0.5px;">노을까지<br>20분 남았어요</h1>

    <p style="margin: 14px 0 0; font-size: 15px; line-height: 1.65; color: rgba(255,255,255,0.88); word-break: keep-all;">서쪽이 트인 능선이라 해가 넘어가는 걸 끝까지 볼 수 있어요. 바람은 선선하고, 계단은 완만해요.</p>

    <div style="display: flex; align-items: center; gap: 10px; margin-top: 18px;">
      <span style="font-size: 15px; font-weight: 700; color: #FFFFFF;">인왕산 자락길</span>
      <span style="width: 3px; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.45);"></span>
      <span style="font-size: 13px; color: rgba(255,255,255,0.72);">차로 18분</span>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 24px; width: 100%;">
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 999px; background: #FFFFFF; color: #2A241F; font-size: 16px; font-weight: 700;">
        여기서 시작하는 코스
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </div>
      <div style="width: 52px; height: 52px; border-radius: 999px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.28); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      </div>
    </div>

    <!-- 스와이프 인디케이터 -->
    <div style="display: flex; gap: 6px; margin-top: 22px; align-self: center;">
      <span style="width: 20px; height: 4px; border-radius: 999px; background: #FFFFFF;"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.40);"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.40);"></span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.40);"></span>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
