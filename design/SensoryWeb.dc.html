<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap');
    body { margin: 0; font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif; }
    a { color: #C5532D; } a:hover { color: #A8421F; }
  </style>
</helmet>

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #2A241F;">

  <!-- 사진 한 장이 화면 전체 (실제로는 TourAPI firstImage) -->
  <div style="position: absolute; inset: 0; background: linear-gradient(118deg, #3D2914 0%, #7A5642 26%, #C5532D 58%, #B8860B 84%, #7A5642 100%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(42,36,31,0.86) 0%, rgba(42,36,31,0.30) 52%, rgba(42,36,31,0.06) 100%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to right, rgba(42,36,31,0.62) 0%, rgba(42,36,31,0.10) 46%, transparent 70%);"></div>

  <!-- 투명 헤더 -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 64px;">
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 24px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.8 5.41a2 2 0 0 1-1.27 1.27l-5.41 1.8 1.8-5.41a2 2 0 0 1 1.27-1.27z"/></svg>
        <span style="font-family: 'Jua', sans-serif; font-size: 20px; color: #FFFFFF;">이모추</span>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; margin-left: 8px;">
        <span style="padding: 8px 12px; font-size: 14px; font-weight: 700; color: #FFFFFF;">홈</span>
        <span style="padding: 8px 12px; font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.65);">코스</span>
        <span style="padding: 8px 12px; font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.65);">축제</span>
      </div>
      <div style="flex: 1;"></div>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 999px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.24); font-size: 13px; font-weight: 700; color: #FFFFFF;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        서울
      </span>
      <span style="font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.85);">로그인</span>
    </div>
  </div>

  <!-- 감각 한 문장이 주인공 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0;">
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 32px 56px; display: flex; align-items: flex-end; gap: 40px;">

      <div style="width: 720px; flex-shrink: 0;">
        <span style="display: inline-flex; align-items: center; height: 30px; padding: 0 13px; border-radius: 999px; background: rgba(197,83,45,0.92); font-size: 13px; font-weight: 700; color: #FFFFFF; margin-bottom: 20px;">
          지금 출발하면 딱
        </span>
        <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 68px; line-height: 1.12; color: #FFFFFF; word-break: keep-all; letter-spacing: -1px;">노을까지 20분<br>남았어요</h1>
        <p style="margin: 20px 0 0; font-size: 18px; line-height: 1.7; color: rgba(255,255,255,0.88); max-width: 560px; word-break: keep-all;">서쪽이 트인 능선이라 해가 넘어가는 걸 끝까지 볼 수 있어요. 바람은 선선하고, 계단은 완만해요.</p>

        <div style="display: flex; align-items: center; gap: 12px; margin-top: 20px;">
          <span style="font-size: 17px; font-weight: 700; color: #FFFFFF;">인왕산 자락길</span>
          <span style="width: 3px; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.45);"></span>
          <span style="font-size: 14px; color: rgba(255,255,255,0.72);">종로구 · 차로 18분</span>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 28px;">
          <span style="display: inline-flex; align-items: center; gap: 8px; height: 56px; padding: 0 28px; border-radius: 999px; background: #FFFFFF; color: #2A241F; font-size: 17px; font-weight: 700;">
            여기서 시작하는 코스 만들기
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </span>
          <span style="width: 56px; height: 56px; border-radius: 999px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.28); display: flex; align-items: center; justify-content: center;">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          </span>
        </div>
      </div>

      <div style="flex: 1;"></div>

      <!-- 다음 장면들 — 모바일의 스와이프가 웹에서는 필름스트립이 된다 -->
      <div style="width: 456px; flex-shrink: 0;">
        <p style="margin: 0 0 12px; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.70);">다음 장면</p>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
          <div>
            <div style="height: 96px; border-radius: 10px; background: linear-gradient(140deg, #5A7A4F 0%, #7A9A6F 100%); border: 1px solid rgba(255,255,255,0.18);"></div>
            <p style="margin: 8px 0 0; font-size: 13px; font-weight: 700; color: #FFFFFF;">서울숲 은행길</p>
            <p style="margin: 1px 0 0; font-size: 12px; color: rgba(255,255,255,0.62);">아직 초록이에요</p>
          </div>
          <div>
            <div style="height: 96px; border-radius: 10px; background: linear-gradient(140deg, #4A6B8A 0%, #7A8FA8 100%); border: 1px solid rgba(255,255,255,0.18);"></div>
            <p style="margin: 8px 0 0; font-size: 13px; font-weight: 700; color: #FFFFFF;">한강 노들섬</p>
            <p style="margin: 1px 0 0; font-size: 12px; color: rgba(255,255,255,0.62);">바람이 좋은 시간</p>
          </div>
          <div>
            <div style="height: 96px; border-radius: 10px; background: linear-gradient(140deg, #B8860B 0%, #C5532D 100%); border: 1px solid rgba(255,255,255,0.18);"></div>
            <p style="margin: 8px 0 0; font-size: 13px; font-weight: 700; color: #FFFFFF;">광장시장 골목</p>
            <p style="margin: 1px 0 0; font-size: 12px; color: rgba(255,255,255,0.62);">저녁이면 불이 켜져요</p>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
