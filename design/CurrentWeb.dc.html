<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap');
    body { margin: 0; font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif; }
    a { color: #C5532D; } a:hover { color: #A8421F; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; overflow: hidden; background: #FAF7F2; color: #4A4038;">

  <!-- 데스크톱 헤더 (h-16, max-w-7xl, px-8) -->
  <div style="height: 64px; background: rgba(250,247,242,0.95); border-bottom: 1px solid transparent;">
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 24px;">
      <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C5532D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.8 5.41a2 2 0 0 1-1.27 1.27l-5.41 1.8 1.8-5.41a2 2 0 0 1 1.27-1.27z"/></svg>
        <span style="font-family: 'Jua', sans-serif; font-size: 20px; color: #2A241F;">이모추</span>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; margin-left: 8px;">
        <span style="position: relative; padding: 8px 12px; font-size: 14px; font-weight: 700; color: #2A241F;">홈<span style="position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 999px; background: #C5532D;"></span></span>
        <span style="padding: 8px 12px; font-size: 14px; font-weight: 700; color: #7A6E62;">코스</span>
        <span style="padding: 8px 12px; font-size: 14px; font-weight: 700; color: #7A6E62;">축제</span>
      </div>
      <div style="flex: 1;"></div>
      <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; background: #FFFFFF; border: 1px solid #E8DFD2; width: 220px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A8917A" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span style="font-size: 13px; color: #A8917A;">어디로 가볼까요?</span>
      </div>
      <span style="font-size: 13px; font-weight: 500; color: #7A6E62;">서울 ▾</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 700; color: #4A4038;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
        로그인
      </span>
    </div>
  </div>

  <!-- 히어로 60vh -->
  <div style="position: relative; height: 540px; overflow: hidden; background: linear-gradient(135deg, #3D2914 0%, #5C3D2A 50%, #7A5642 100%);">
    <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(42,36,31,0.70) 0%, rgba(42,36,31,0.20) 55%, rgba(42,36,31,0) 100%);"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0;">
      <div style="max-width: 1280px; margin: 0 auto; padding: 0 32px 48px;">
        <span style="display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); padding: 5px 14px; font-size: 14px; font-weight: 700; color: #FFFFFF; margin-bottom: 12px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
          감정 · 동반자 · 사주로 짜는 주말
        </span>
        <p style="margin: 0 0 8px; font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.80);">9월 5~6일 · 서울</p>
        <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 48px; line-height: 1.2; color: #FFFFFF; max-width: 672px; word-break: keep-all;">이번 주말, 햇살 따라 어디로 떠나볼까요?</h1>
        <p style="margin: 12px 0 0; font-size: 18px; line-height: 1.6; color: rgba(255,255,255,0.85); max-width: 576px; word-break: keep-all;">기분과 동반자, 오늘의 사주 기운까지 반영해 AI가 코스를 설계해요.</p>
        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <span style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 8px; background: #C5532D; color: #fff; font-size: 16px; font-weight: 700;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
            AI 코스 만들기
          </span>
          <span style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 8px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.30); color: #fff; font-size: 16px; font-weight: 700;">추천 둘러보기</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 접힘 아래: 오늘의 기운 카드가 여기서 시작한다 -->
  <div style="max-width: 1280px; margin: 0 auto; padding: 40px 32px 0;">
    <div style="display: flex; align-items: center; gap: 16px; padding: 24px; border-radius: 12px; border: 1px solid rgba(197,83,45,0.25); background: linear-gradient(135deg, rgba(245,224,213,0.60) 0%, rgba(245,224,213,0) 100%);">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: 12px; border: 1px solid #FECACA; background: #FEF2F2; color: #EF4444; flex-shrink: 0;">
        <span style="font-size: 30px; line-height: 1;">🔥</span>
        <span style="font-size: 11px; font-weight: 700; margin-top: 4px;">火 (화)</span>
      </div>
      <div style="flex: 1;">
        <p style="margin: 0; font-size: 12px; color: #A8917A;">오늘의 기운</p>
        <p style="margin: 0; font-family: 'Jua', sans-serif; font-size: 18px; color: #2A241F;">火 (화) 기운이 흐르는 날</p>
        <p style="margin: 2px 0 0; font-size: 14px; font-weight: 700; color: #C5532D;">야경 · 전망 · 축제</p>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C5532D" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
